name: meshtalk_client
description: "Offline-First Resilient Messaging App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Core
  go_router: ^14.0.0
  uuid: ^4.6.0
  intl: ^0.20.3
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Backend
  supabase_flutter: ^2.5.4
  
  # Auth Providers
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  
  # Local Storage
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.5.5
  
  # Crypto & Security
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  
  # Networking
  web_socket_channel: ^3.0.3
  connectivity_plus: ^6.0.3
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  drift_dev: ^2.19.0

flutter:
  uses-material-design: true
